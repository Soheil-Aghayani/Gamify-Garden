<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f0"/>
      <stop offset="0.52" stop-color="#f8f1ff"/>
      <stop offset="1" stop-color="#eaf8ef"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfb" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f4fbf6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9e3c8"/>
      <stop offset="1" stop-color="#4e9f78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#6b5574" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="84" cy="84" r="156" fill="#ffd9c9" fill-opacity="0.58"/>
  <circle cx="1135" cy="570" r="190" fill="#e8e0ff" fill-opacity="0.65"/>
  <circle cx="1065" cy="85" r="58" fill="#ffe7a6" fill-opacity="0.8"/>

  <rect x="58" y="54" width="1084" height="522" rx="52" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.78" stroke-width="3" filter="url(#shadow)"/>

  <g transform="translate(146 150)">
    <circle cx="158" cy="158" r="136" fill="#e1f4ea"/>
    <circle cx="158" cy="158" r="114" fill="#fffdfb" stroke="#d8f0e1" stroke-width="12"/>
    <ellipse cx="158" cy="258" rx="78" ry="17" fill="#d9eee2"/>
    <path d="M158 258c-7-56-2-101 23-150" fill="none" stroke="#a87562" stroke-linecap="round" stroke-width="16"/>
    <path d="M178 142c-3-34 22-58 60-58-5 34-25 55-60 58Z" fill="url(#leaf)"/>
    <path d="M157 178c-37-4-58-27-58-61 39 3 64 27 58 61Z" fill="#79c49a"/>
    <circle cx="182" cy="72" r="22" fill="#ffd9c9"/>
    <circle cx="150" cy="76" r="22" fill="#e8e0ff"/>
    <circle cx="166" cy="53" r="22" fill="#ffe7a6"/>
    <circle cx="166" cy="72" r="15" fill="#a9e3c8"/>
    <text x="36" y="48" fill="#3e8b6b" font-size="30" font-family="Tahoma, sans-serif">✦</text>
    <text x="284" y="272" fill="#df9cae" font-size="36" font-family="Tahoma, sans-serif">✧</text>
  </g>

  <g text-anchor="end" font-family="Tahoma, Arial, sans-serif">
    <text x="1030" y="170" fill="#3e8b6b" font-size="25" font-weight="700">برای فاطمه، با کمی نور زمستانی</text>
    <text x="1030" y="246" fill="#433c52" font-size="58" font-weight="700">Apricity</text>
    <text x="1030" y="316" fill="#5d536e" font-size="32" font-weight="700">باغ قدم‌های کوچک</text>
    <text x="1030" y="374" fill="#6b6177" font-size="23">هر روز فقط یک جوانه‌ی کوچک کافی است.</text>
  </g>

  <g transform="translate(780 460)">
    <rect width="250" height="54" rx="27" fill="#e1f4ea"/>
    <circle cx="32" cy="27" r="8" fill="#6db797"/>
    <text x="218" y="35" text-anchor="end" fill="#3e8b6b" font-size="20" font-family="Tahoma, sans-serif">آرام، کوچک، دوست‌داشتنی</text>
  </g>
</svg>
